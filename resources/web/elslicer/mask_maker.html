<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mask Maker</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-columns: 340px 1fr; gap: 18px; height: 100vh; }
  .side { overflow-y: auto; padding-right: 6px; }
  h3 { margin: 16px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid button { padding: 6px 4px; font-size: 12px; }
  .grid button small { display: block; color: var(--muted); font-size: 11px; }
  .grid button.on, .seg button.on { border-color: var(--accent); color: var(--accent); }
  .slider { display: grid; grid-template-columns: 112px 1fr 58px; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  .slider label { color: var(--muted); }
  .slider input[type=range] { min-width: 0; }
  .slider input[type=number] { width: 58px; padding: 4px 6px; }
  .seg { display: flex; gap: 6px; margin: 6px 0; }
  .seg button { flex: 1; padding: 6px; font-size: 13px; }
  .colours { display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .colours input { width: 34px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
  .view { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 8px; }
  #canvas { flex: 1; min-height: 0; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #101114; }
  #facts { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="side">
  <h1>Mask Maker</h1>
  <p class="sub">A thin lace carnival mask that prints flat, with loops at the sides for elastic or ribbon.</p>

  <h3>Shape</h3>
  <div class="grid" id="shapes"></div>
  <div id="shapeSliders" style="margin-top:6px"></div>

  <h3>Eyes</h3>
  <div class="seg">
    <button data-eye="almond">Almond</button>
    <button data-eye="round">Round</button>
    <button data-eye="cat">Cat eye</button>
    <button data-eye="diamond">Diamond</button>
    <button data-eye="heart">Heart</button>
  </div>
  <div id="eyeSliders"></div>

  <h3>Lace</h3>
  <div class="grid">
    <button data-net="guipure">Guipure<small>echoes and cells</small></button>
    <button data-net="lace">Flowers<small>on tulle</small></button>
    <button data-net="filigree">Filigree<small>vines and curls</small></button>
    <button data-net="diamond">Diamond<small>net</small></button>
    <button data-net="honey">Honeycomb</button>
    <button data-net="scales">Scales</button>
    <button data-net="dots">Eyelets<small>holes</small></button>
    <button data-net="solid">Solid<small>no holes</small></button>
  </div>
  <div id="laceSliders" style="margin-top:6px"></div>
  <div id="seedRow" class="seg"><button id="reseed" title="Grow the filigree again from a different start">New pattern</button></div>

  <h3>Ornament</h3>
  <div class="seg">
    <button data-edge="smooth">Smooth edge</button>
    <button data-edge="scallop">Scalloped</button>
    <button data-edge="beads">Beaded</button>
    <button data-edge="picot">Picot</button>
  </div>
  <label class="check" id="scrollsRow"><input type="checkbox" id="scrolls" checked> Scrolls along the edge</label>
  <label class="check"><input type="checkbox" id="centre" checked> Ornament between the eyes</label>
  <label class="check"><input type="checkbox" id="eyeBeads" checked> Beads round the eyes</label>
  <div id="ornSliders"></div>

  <h3>Loops</h3>
  <div class="seg">
    <button data-loop="ring" title="A round ring for elastic cord">Ring</button>
    <button data-loop="slot" title="A long slot a flat ribbon threads through">Ribbon slot</button>
  </div>
  <div id="loopSliders"></div>

  <h3>Printing</h3>
  <div id="printSliders"></div>
  <div class="colours"><span>Preview colour</span><input type="color" id="colour" value="#f4f1ea"></div>

  <p class="note warn hidden" id="problem" style="margin-top:14px"></p>
  <div class="footer">
    <button id="cancel">Cancel</button>
    <button id="add" class="primary">Add to plate</button>
  </div>
</div>
<div class="view">
  <canvas id="canvas"></canvas>
  <div id="facts"></div>
</div>
<script src="lampkit.js"></script>
<script>
const $ = id => document.getElementById(id);
const post = message => window.wx.postMessage(JSON.stringify(message));
let printer = {bed: [256, 256], height: 256, layer: 0.2};

// Right half of each outline, mm, from the top centre clockwise to the nose bridge; the eyes are centred on y = 0.
// Drawn for a mask 180 mm wide and scaled to the width chosen. A third value of 1 makes a sharp point.
// curls: [tip x, y, centre dx, dy, turn] are tendrils curling off the outline, antennae: [from, control, to] end in a curl.
const SHAPES = {
  classic:   {name: 'Classic', hint: 'a spire and swept tips', pts: [[0,40,1],[3,30],[7,23],[14,20],[24,21],[36,23],[50,25],[62,27],[74,30],[84,36],[92,43],[97,49,1],[94,36],[93,22],[95,6,1],
               [90,-4],[80,-12],[68,-18],[54,-20],[40,-19],[28,-16],[16,-13],[8,-13],[3,-17],[0,-21,1]]},
  carnival:  {name: 'Carnival', hint: 'upturned horns', pts: [[0,20],[6,24],[12,30,1],[18,24],[28,22],[40,23],[54,25],[66,28],[76,33],[84,40],[90,48],[94,56,1],[96,44],[96,30],[94,16],[95,6,1],
               [88,-4],[80,-14],[68,-20],[54,-22],[40,-21],[28,-18],[18,-15],[10,-15],[4,-20],[0,-26,1]],
               curls: [[94,56,-4,1,1]]},
  bow:       {name: 'Bow', hint: 'wings above and below', pts: [[0,6,1],[4,10],[10,16],[20,24],[32,30],[46,34],[60,36],[74,37],[86,40],[96,46,1],[94,34],[90,24],[92,12],[95,4,1],
               [90,-6],[80,-14],[68,-19],[58,-24],[48,-32],[38,-40],[28,-46],[20,-47,1],[16,-36],[10,-24],[5,-18],[0,-15,1]],
               curls: [[96,46,-2,5,1],[20,-47,4,2,-1]]},
  flick:     {name: 'Flick', hint: 'slim, tails flicked up', pts: [[0,26,1],[3,20],[6,17],[12,14],[22,15],[34,17],[48,18],[62,17],[74,16],[84,18],[92,24],[98,32],[101,38,1],[96,24],[92,12],[90,2],
               [86,-8],[78,-14],[66,-18],[54,-19],[42,-18],[30,-16],[18,-13],[9,-12],[3,-15],[0,-17,1]],
               curls: [[101,38,-4,1,1]]},
  venetian:  {name: 'Venetian', hint: 'swept wings, cheek curls', pts: [[0,24,1],[4,20],[9,17],[16,17],[26,20],[38,26],[50,33],[62,41],[72,49],[80,56],[85,61,1],[84,52],[82,44],[84,36],[88,28],[92,18],[94,8,1],
               [92,0],[88,-8],[84,-16],[80,-25,1],[74,-20],[66,-18],[58,-20],[48,-22],[38,-21],[28,-18],[18,-15],[10,-14],[4,-16],[0,-19,1]],
               curls: [[85,61,-2,6,1],[80,-25,3,-3,-1]]},
  crown:     {name: 'Crown', hint: 'a fleur-de-lis crest', pts: [[0,50,1],[2,44],[4,40],[7,39],[10,43],[12,47,1],[12,40],[10,34],[12,30],[16,27],[22,26],[32,28],[44,32],[56,38],[68,46],[78,54],[86,60,1],
               [86,50],[86,40],[89,30],[93,18],[94,6,1],[90,-4],[82,-14],[70,-21],[56,-23],[42,-22],[30,-19],[18,-16],[9,-15],[3,-18],[0,-22,1]],
               curls: [[86,60,-2,6,1]]},
  fox:       {name: 'Fox', hint: 'tall ears, pointed snout', pts: [[0,18],[14,19],[28,22],[40,27],[50,33,1],[57,48],[64,62],[70,74,1],[76,60],[82,46],[89,32],[96,18,1],
               [94,4],[92,-8],[94,-19],[96,-28,1],[86,-23],[76,-21],[64,-21],[52,-21],[40,-21],[30,-22],[20,-25],[12,-30],[5,-36],[0,-40,1]]},
  bat:       {name: 'Bat', hint: 'scalloped wings', pts: [[0,6,1],[2,9],[4,16],[6,22,1],[9,14],[12,12],[20,14],[32,20],[46,28],[60,36],[74,44],[86,52],[96,58,1],
               [91,45],[94,32,1],[89,20],[93,8,1],[88,-2],[80,-12],[68,-19],[54,-22],[40,-21],[28,-18],[16,-15],[7,-12],[0,-12,1]]},
  butterfly: {name: 'Butterfly', hint: 'wings and antennae', pts: [[0,7,1],[8,14],[20,30],[32,46],[46,58],[62,64],[78,60],[89,48],[93,34],[90,21],[84,13],[77,8,1],[84,1],[89,-13],[86,-27],[75,-39],[61,-45],[48,-43],[37,-34],[27,-27],[16,-24],[7,-22],[0,-26,1]],
               antennae: [[[1,8],[1,28],[9,40]]], body: true},
  wings:     {name: 'Wings', hint: 'swept up feathers', pts: [[0,15,1],[6,20],[16,21],[30,24],[46,31],[62,42],[76,54],[88,63],[98,68,1],[96,56],[92,42],[90,27],[89,10],[84,-6],[72,-19],[57,-26],[43,-25],[29,-20],[15,-16],[5,-12],[0,-10,1]],
               curls: [[98,68,-4,4,1]]},
  slim:      {name: 'Slim', hint: 'a narrow band', pts: [[0,22,1],[2,17],[6,14],[14,14],[26,17],[40,19],[54,19],[66,17],[78,13],[87,7],[92,0],[89,-7],[81,-13],[70,-17],[57,-19],[43,-18],[29,-16],[17,-13],[8,-12],[0,-14,1]]},
};

const p = {shape: 'classic', net: 'guipure', edge: 'picot', loop: 'ring', eyeShape: 'almond', width: 185, height: 110, eyeGap: 66, eyeW: 46, eyeH: 23, eyeTilt: 4,
           rimW: 2.2, pitch: 2.2, line: 1.1, scroll: 4.5, ribbon: 6, loopY: 3, thick: 0.9, res: 0.25, seed: 1, tulle: 2.2};

const sliders = {};
function slider(parent, key, label, min, max, step) {
  const row = document.createElement('div');
  row.className = 'slider';
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><input type="number" min="${min}" max="${max}" step="${step}">`;
  const [range, box] = row.querySelectorAll('input');
  const set = v => { p[key] = v; range.value = v; box.value = v; };
  range.oninput = () => { set(+range.value); update(); };
  box.onchange = () => { const v = parseFloat(box.value); if (isFinite(v)) { set(v); update(); } };
  parent.appendChild(row);
  sliders[key] = set;
  return row;
}
slider($('shapeSliders'), 'width', 'Width mm', 150, 250, 1);
slider($('shapeSliders'), 'height', 'Height %', 70, 140, 1);
slider($('eyeSliders'), 'eyeGap', 'Spread mm', 44, 100, 0.5);
slider($('eyeSliders'), 'eyeW', 'Eye width mm', 20, 64, 0.5);
slider($('eyeSliders'), 'eyeH', 'Eye height mm', 8, 44, 0.5);
slider($('eyeSliders'), 'eyeTilt', 'Tilt mm', -8, 14, 0.5);
slider($('laceSliders'), 'pitch', 'Openness mm', 1.5, 6, 0.1);
slider($('laceSliders'), 'line', 'Thread mm', 0.5, 1.2, 0.05);
const tulleRow = slider($('laceSliders'), 'tulle', 'Tulle mesh mm', 1.6, 4, 0.1);
slider($('ornSliders'), 'rimW', 'Edge band mm', 1.2, 4, 0.1);
slider($('ornSliders'), 'scroll', 'Scroll size mm', 2.5, 8, 0.1);
slider($('loopSliders'), 'ribbon', 'Hole mm', 3, 16, 0.5);
slider($('loopSliders'), 'loopY', 'Height mm', -10, 20, 0.5);
slider($('printSliders'), 'thick', 'Thickness mm', 0.6, 2, 0.05);
slider($('printSliders'), 'res', 'Detail mm', 0.12, 0.3, 0.01);

for (const [key, s] of Object.entries(SHAPES)) {
  const b = document.createElement('button');
  b.dataset.shape = key;
  b.innerHTML = `${s.name}<small>${s.hint}</small>`;
  $('shapes').appendChild(b);
}
const choose = (attr, key) => { for (const b of document.querySelectorAll(`[data-${attr}]`)) b.onclick = () => { p[key] = b.dataset[attr]; update(); }; };
choose('shape', 'shape'); choose('net', 'net'); choose('edge', 'edge'); choose('loop', 'loop'); choose('eye', 'eyeShape');
$('reseed').onclick = () => { p.seed++; update(); };
for (const id of ['scrolls', 'centre', 'eyeBeads', 'colour']) $(id).oninput = update;
function sync() { for (const [k, set] of Object.entries(sliders)) set(p[k]); }

// ---------------------------------------------------------------------------------------------------------------
// Geometry, in mm with y up.
const pathOf = (pts, closed = true) => { const q = new Path2D(); pts.forEach(([x, y], n) => n ? q.lineTo(x, y) : q.moveTo(x, y)); if (closed) q.closePath(); return q; };
const hit = document.createElement('canvas').getContext('2d');

// The whole outline: the right half, then its mirror, through a closed Catmull-Rom spline that stops at sharp points.
function outlinePoints() {
  const sx = p.width / 180, sy = p.height / 100;
  const half = SHAPES[p.shape].pts.map(([x, y, s]) => [x * sx, y * sy, s]);
  const all = [...half, ...half.slice(1, -1).reverse().map(([x, y, s]) => [-x, y, s])];
  const n = all.length, out = [];
  const tan = i => { const [a, b, c] = [all[(i - 1 + n) % n], all[i], all[(i + 1) % n]]; return b[2] ? [0, 0] : [(c[0] - a[0]) / 2, (c[1] - a[1]) / 2]; };
  for (let i = 0; i < n; ++i) {
    const a = all[i], b = all[(i + 1) % n], ma = tan(i), mb = tan((i + 1) % n), steps = 24;
    for (let s = 0; s < steps; ++s) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const h00 = 2 * t3 - 3 * t2 + 1, h10 = t3 - 2 * t2 + t, h01 = -2 * t3 + 3 * t2, h11 = t3 - t2;
      out.push([h00 * a[0] + h10 * ma[0] + h01 * b[0] + h11 * mb[0], h00 * a[1] + h10 * ma[1] + h01 * b[1] + h11 * mb[1]]);
    }
  }
  return out;
}
// One eye, side +1 (right) or -1: drawn from the inner corner over the top to the outer corner and back along the
// bottom, centred on y = -1.5, then sheared so the outer corner sits higher by the tilt.
function eyePoints(side) {
  const w = p.eyeW / 2, h = p.eyeH, out = [];
  const bez = (a, c, b, n = 40) => { for (let s = 0; s < n; ++s) { const t = s / n, u = 1 - t;
    out.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]); } };
  const line = (a, b, n = 30) => { for (let s = 0; s < n; ++s) out.push([a[0] + (b[0] - a[0]) * s / n, a[1] + (b[1] - a[1]) * s / n]); };
  if (p.eyeShape === 'round') {
    for (let s = 0; s < 80; ++s) { const a = Math.PI * s / 40; out.push([-w * Math.cos(a), h / 2 * Math.sin(a)]); }
  } else if (p.eyeShape === 'cat') {
    const tip = [w * 1.3, h * 0.45];
    bez([-w, 0], [0.1 * w, h], tip); bez(tip, [0.15 * w, -0.95 * h], [-w, 0]);
  } else if (p.eyeShape === 'diamond') {
    line([-w, 0], [0, h / 2]); line([0, h / 2], [w, 0]); line([w, 0], [0, -h / 2]); line([0, -h / 2], [-w, 0]);
  } else if (p.eyeShape === 'heart') {
    // The classic heart curve spans x ±16 and y -17..12; fitted to the eye's width and height.
    for (let s = 0; s < 120; ++s) { const t = 2 * Math.PI * s / 120;
      out.push([16 * Math.sin(t) ** 3 * w / 16,
                ((13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) + 2.5) * h / 29]); }
  } else {
    bez([-w, 0], [0, h], [w, 0]); bez([w, 0], [0, -0.9 * h], [-w, 0]);
  }
  const cx = side * p.eyeGap / 2;
  return out.map(([x, y]) => [cx + side * x, y - 1.5 + p.eyeTilt * (x + w) / (2 * w)]);
}
// Points along a polyline every `step` mm, with the inward normal there (the outline runs clockwise).
function along(pts, step, offset = 0) {
  const out = [];
  let carry = 0;
  for (let n = 0; n < pts.length; ++n) {
    const a = pts[n], b = pts[(n + 1) % pts.length], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
    if (L < 1e-9) continue;
    const nx = dy / L, ny = -dx / L;
    for (let d = carry; d < L; d += step) {
      const t = d / L;
      out.push({x: a[0] + dx * t + nx * offset, y: a[1] + dy * t + ny * offset, nx, ny});
    }
    carry = ((carry - L) % step + step) % step;
  }
  return out;
}
function spiral(g, cx, cy, a0, dir, r0, w) {
  g.beginPath();
  for (let s = 0; s <= 60; ++s) {
    const t = s / 60, a = a0 + dir * t * 2.3 * Math.PI, r = r0 * (1 - 0.75 * t);
    s ? g.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)) : g.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
  }
  g.lineWidth = w; g.lineCap = 'round'; g.stroke();
  const a = a0 + dir * 2.3 * Math.PI, r = r0 * 0.25;
  g.beginPath(); g.arc(cx + r * Math.cos(a), cy + r * Math.sin(a), w * 0.9, 0, 2 * Math.PI); g.fill();
}
// Where the outline crosses height y furthest out on the right.
function sideAt(pts, y) {
  let best = 0;
  for (let n = 0; n < pts.length; ++n) {
    const a = pts[n], b = pts[(n + 1) % pts.length];
    if ((a[1] - y) * (b[1] - y) <= 0 && a[1] !== b[1]) best = Math.max(best, a[0] + (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]));
  }
  return best;
}

// Two layers: the band (edge, eye rims, scrolls, loops) prints at full thickness, the lace between at lace thickness.
function draw(k, ox, oy, W, H) {
  const outline = outlinePoints(), outlinePath = pathOf(outline);
  const right = eyePoints(1), eyes = [right, right.map(([x, y]) => [-x, y]).reverse()], eyePaths = eyes.map(e => pathOf(e));
  const make = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
    g.setTransform(k, 0, 0, -k, ox, oy); g.fillStyle = g.strokeStyle = '#fff'; g.lineJoin = 'round'; return [c, g]; };
  const [laceC, lace] = make(), [bandC, band] = make();
  const [, , , , minY, maxY] = [0, 0, 0, 0, ...extentY(outline)];
  const minX = -p.width / 2 - 10, maxX = p.width / 2 + 10;

  // The lace, clipped to the outline.
  lace.save(); lace.clip(outlinePath);
  lace.lineWidth = p.line;
  const P = p.pitch;
  if (p.net === 'solid' || p.net === 'dots') {
    lace.fill(outlinePath);
    if (p.net === 'dots') {
      lace.globalCompositeOperation = 'destination-out';
      const r = (P - p.line) / 2;
      for (let row = 0, y = minY; y < maxY; y += P * 0.866, ++row)
        for (let x = minX + (row % 2) * P / 2; x < maxX; x += P) { lace.beginPath(); lace.arc(x, y, r, 0, 2 * Math.PI); lace.fill(); }
      lace.globalCompositeOperation = 'source-over';
    }
  } else if (p.net === 'diamond') {
    const t = Math.tan(56 * Math.PI / 180), span = (maxY - minY) / t;
    lace.beginPath();
    for (let x = minX - span; x < maxX + span; x += P / Math.sin(56 * Math.PI / 180)) {
      lace.moveTo(x, minY); lace.lineTo(x + span, maxY); lace.moveTo(x, maxY); lace.lineTo(x + span, minY);
    }
    lace.stroke();
  } else if (p.net === 'lace') {
    // Tulle: the fine hexagonal net lace is worked on, in a thinner thread.
    const r = p.tulle / Math.sqrt(3), dx = Math.sqrt(3) * r, dy = 1.5 * r;
    lace.lineWidth = Math.max(0.5, p.line * 0.55);
    lace.beginPath();
    for (let row = 0, y = minY - r; y < maxY + r; y += dy, ++row)
      for (let x = minX + (row % 2) * dx / 2; x < maxX + dx; x += dx)
        for (let s = 0; s <= 6; ++s) { const a = Math.PI / 6 + s * Math.PI / 3; s ? lace.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)) : lace.moveTo(x + r * Math.cos(a), y + r * Math.sin(a)); }
    lace.stroke();
  } else if (p.net === 'honey') {
    const r = P / Math.sqrt(3) * 1.2, dx = Math.sqrt(3) * r, dy = 1.5 * r;
    lace.beginPath();
    for (let row = 0, y = minY - r; y < maxY + r; y += dy, ++row)
      for (let x = minX + (row % 2) * dx / 2; x < maxX + dx; x += dx)
        for (let s = 0; s <= 6; ++s) { const a = Math.PI / 6 + s * Math.PI / 3; s ? lace.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)) : lace.moveTo(x + r * Math.cos(a), y + r * Math.sin(a)); }
    lace.stroke();
  } else if (p.net === 'scales') {
    const r = P * 0.75;
    lace.beginPath();
    for (let row = 0, y = maxY + r; y > minY - r; y -= r, ++row)
      for (let x = minX + (row % 2) * r; x < maxX + 2 * r; x += 2 * r) { lace.moveTo(x + r, y); lace.arc(x, y, r, 0, -Math.PI, true); }
    lace.stroke();
  }
  lace.restore();

  // The band: the edge all round, with scallops or beads.
  band.lineWidth = p.rimW;
  band.stroke(outlinePath);
  if (p.edge === 'scallop') {
    const r = p.rimW * 0.9 + 0.7;
    for (const q of along(outline, 2.4 * r, -0.2)) { band.beginPath(); band.arc(q.x, q.y, r, 0, 2 * Math.PI); band.fill(); }
  } else if (p.edge === 'picot') {
    // Picots: the little loops lace makers work along an edge.
    const r = 1.2 + p.line * 0.3;
    band.save(); band.lineWidth = Math.max(0.7, p.line * 0.75);
    for (const q of along(outline, 2.6 * r, -(p.rimW / 2 + r * 0.75))) { band.beginPath(); band.arc(q.x, q.y, r, 0, 2 * Math.PI); band.stroke(); }
    band.restore();
