<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tulle Card Wrap</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: grid; grid-template-columns: 350px 1fr; gap: 18px; height: 100vh; }
  .side { overflow-y: auto; padding-right: 6px; }
  h3 { margin: 16px 0 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .slider { display: grid; grid-template-columns: 116px 1fr 58px; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  .slider label { color: var(--muted); }
  .slider input[type=range] { min-width: 0; }
  .slider input[type=number] { width: 58px; padding: 4px 6px; }
  .seg { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  .seg button { flex: 1; padding: 6px; font-size: 12px; white-space: nowrap; }
  .seg button.on, .tabs button.on { border-color: var(--accent); color: var(--accent); }
  .row { display: grid; grid-template-columns: 116px 1fr; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  .row label { color: var(--muted); }
  .row input[type=text], .row select { width: 100%; }
  .colours { display: flex; gap: 14px; font-size: 13px; color: var(--muted); align-items: center; margin: 6px 0; }
  .colours input { width: 34px; height: 24px; padding: 0; border: none; background: none; }
  .view { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 8px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { font-size: 13px; padding: 5px 14px; }
  .stage { flex: 1; min-height: 0; position: relative; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 8px; background: #101114; }
  #facts { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .hint { font-size: 12px; color: var(--muted); margin: 4px 0; }
</style>
</head>
<body>
<div class="side">
  <h1>Tulle Card Wrap</h1>
  <p class="sub">Gold lines printed straight onto tulle, flat, then folded round a piece of card. You design the front; each flap prints the part of it that shows once it's folded.</p>

  <h3>Card</h3>
  <div class="seg" id="cards"></div>
  <div id="cardSliders"></div>

  <h3>Wrap</h3>
  <div class="seg" id="styles"></div>
  <p class="hint" id="styleHint"></p>

  <h3>Words</h3>
  <div class="row"><label>Top line</label><input type="text" id="line1"></div>
  <div class="row"><label>Name</label><input type="text" id="line2"></div>
  <div class="row"><label>Font</label><select id="font"></select></div>
  <label class="check"><input type="checkbox" id="bold"> Bold</label>
  <div id="textSliders"></div>

  <h3>Front</h3>
  <div class="seg" id="frames"></div>
  <div class="seg" id="corners"></div>
  <div class="seg" id="cartouches"></div>
  <div class="seg" id="motifs"></div>
  <div class="seg" id="fills"></div>
  <div id="frontSliders"></div>

  <h3>Printing</h3>
  <div id="printSliders"></div>
  <div class="colours">
    <span>Tulle <input type="color" id="tulle" value="#2f6b4f"></span>
    <span>Filament <input type="color" id="gold" value="#d9c46a"></span>
  </div>

  <p class="note warn hidden" id="problem" style="margin-top:14px"></p>
  <div class="footer">
    <button id="cancel">Cancel</button>
    <button id="add" class="primary">Add to plate</button>
  </div>
</div>
<div class="view">
  <div class="tabs">
    <button data-tab="front">Folded</button>
    <button data-tab="net">As printed</button>
  </div>
  <div class="stage"><canvas id="view"></canvas></div>
  <div id="facts"></div>
</div>
<script src="lampkit.js"></script>
<script>
const $ = id => document.getElementById(id);
const post = message => window.wx.postMessage(JSON.stringify(message));
let printer = {bed: [256, 256], height: 256, layer: 0.2};

const CARDS = {gift: ['120 × 85', 120, 85], a7: ['A7', 105, 74], a6: ['A6', 148, 105], biz: ['85 × 55', 85, 55], custom: ['Custom']};
const STYLES = {envelope: 'Envelope', wrap: 'Wrap'};
const STYLE_HINTS = {
  envelope: 'Four pointed flaps fold over the card, sides first, then the bottom, then the top, which carries the name.',
  wrap: 'Narrow side flaps, then a bottom panel and a top panel that overlap across the front. The top panel carries the name.',
};
const FRAMES = {double: 'Double frame', single: 'Single frame', none: 'No frame'};
const CORNERS = {fans: 'Fans', steps: 'Steps', none: 'Plain corners'};
const CARTOUCHES = {pill: 'Oval', octagon: 'Octagon', none: 'No plaque'};
const MOTIFS = {steps: 'Stepped crowns', none: 'No crowns'};
const FILLS = {none: 'Bare tulle', bars: 'Bars', diamonds: 'Diamonds', rays: 'Rays', dots: 'Dots', roses: 'Roses', lace: 'Lace', daisies: 'Daisies',
               leaves: 'Leaves', hearts: 'Hearts', stars: 'Stars', flakes: 'Snowflakes', scales: 'Scallops'};
const FONTS = ['Didot', 'Bodoni 72', 'Baskerville', 'Georgia', 'Futura', 'Avenir Next', 'Gill Sans', 'Copperplate',
               'Optima', 'Snell Roundhand', 'Savoye LET', 'Zapfino', 'Bradley Hand', 'American Typewriter'];

const p = {card: 'gift', W: 120, H: 85, board: 1.5, style: 'envelope',
           line1: 'Merry Christmas', line2: 'Annabelle', font: 'Didot', bold: false, size1: 5, size2: 10.5,
           frame: 'double', corner: 'fans', cartouche: 'pill', motif: 'steps', fill: 'bars',
           line: 1, inset: 4, cartW: 0.64, cartH: 0.3, space: 4,
           thick: 0.6, res: 0.25};
let tab = 'front';

// ---------------------------------------------------------------------------------------------------------------
// Controls
const sliders = [];
function slider(parent, key, label, min, max, step, after) {
  const row = document.createElement('div');
  row.className = 'slider';
  row.innerHTML = `<label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}"><input type="number" min="${min}" max="${max}" step="${step}">`;
  const [range, box] = row.querySelectorAll('input');
  const show = () => { range.value = p[key]; box.value = +(+p[key]).toFixed(3); };
  const set = v => { p[key] = v; show(); if (after) after(); update(); };
  range.oninput = () => set(+range.value);
  box.onchange = () => { const v = parseFloat(box.value); if (isFinite(v)) set(Math.min(max, Math.max(min, v))); };
  parent.appendChild(row);
  sliders.push(show);
  return row;
}
function buttons(parent, map, key, after) {
  for (const [k, v] of Object.entries(map)) {
    const b = document.createElement('button');
    b.textContent = Array.isArray(v) ? v[0] : v;
    b.dataset[key] = k;
    b.onclick = () => { p[key] = k; if (after) after(k); update(); };
    parent.appendChild(b);
  }
}
const showAll = () => sliders.forEach(s => s());

// A new card size brings words in proportion to it.
const wordsToCard = () => { p.size1 = +(p.H * 0.059).toFixed(1); p.size2 = +(p.H * 0.124).toFixed(1); };
buttons($('cards'), CARDS, 'card', k => { if (CARDS[k][1]) { p.W = CARDS[k][1]; p.H = CARDS[k][2]; wordsToCard(); } showAll(); });
slider($('cardSliders'), 'W', 'Width mm', 50, 200, 0.5, () => { p.card = 'custom'; });
slider($('cardSliders'), 'H', 'Height mm', 40, 150, 0.5, () => { p.card = 'custom'; });
slider($('cardSliders'), 'board', 'Card thick mm', 0.3, 4, 0.1);
buttons($('styles'), STYLES, 'style');
slider($('textSliders'), 'size1', 'Top line mm', 2.5, 12, 0.1);
slider($('textSliders'), 'size2', 'Name mm', 4, 24, 0.1);
buttons($('frames'), FRAMES, 'frame');
buttons($('corners'), CORNERS, 'corner');
buttons($('cartouches'), CARTOUCHES, 'cartouche');
buttons($('motifs'), MOTIFS, 'motif');
// The flower patterns want the whole front: picking one takes off the Art Deco corners and crowns (they can go back on).
buttons($('fills'), FILLS, 'fill', k => { if (['roses', 'lace', 'daisies', 'leaves'].includes(k)) { p.corner = 'none'; p.motif = 'none'; } });
slider($('frontSliders'), 'line', 'Line mm', 0.6, 2.5, 0.05);
slider($('frontSliders'), 'inset', 'Frame from edge', 1.5, 12, 0.1);
slider($('frontSliders'), 'cartW', 'Plaque width', 0.4, 0.8, 0.01);
slider($('frontSliders'), 'cartH', 'Plaque height', 0.18, 0.42, 0.01);
slider($('frontSliders'), 'space', 'Pattern mm', 2.5, 12, 0.1);
slider($('printSliders'), 'thick', 'Gold thick mm', 0.4, 1.2, 0.05);
slider($('printSliders'), 'res', 'Detail mm', 0.15, 0.4, 0.01);
for (const f of FONTS) { const o = document.createElement('option'); o.textContent = f; o.style.fontFamily = f; $('font').appendChild(o); }
$('line1').value = p.line1; $('line2').value = p.line2; $('font').value = p.font;
$('line1').oninput = () => { p.line1 = $('line1').value; update(); };
$('line2').oninput = () => { p.line2 = $('line2').value; update(); };
$('font').onchange = () => { p.font = $('font').value; update(); };
$('bold').onchange = () => { p.bold = $('bold').checked; update(); };
$('tulle').oninput = $('gold').oninput = () => draw();
for (const b of document.querySelectorAll('[data-tab]')) b.onclick = () => { tab = b.dataset.tab; update(); };

// ---------------------------------------------------------------------------------------------------------------
// The front, as seen once folded: mm, x right, y up, origin at the card's bottom left corner.
const fontOf = size => `${p.bold ? '700 ' : ''}${size}px "${p.font}", Georgia, serif`;
// The plaque in the middle: its outline, and how wide the words inside may be.
function plaque(W, H) {
  const cw = W * p.cartW, ch = H * p.cartH, cx = W / 2, cy = H / 2, w = p.line;
  const path = (grow) => {
    const x0 = cx - cw / 2 - grow, x1 = cx + cw / 2 + grow, y0 = cy - ch / 2 - grow, y1 = cy + ch / 2 + grow, path = new Path2D();
    if (p.cartouche === 'pill') {
      const r = (y1 - y0) / 2;
      path.moveTo(x0 + r, y0); path.lineTo(x1 - r, y0); path.arc(x1 - r, cy, r, -Math.PI / 2, Math.PI / 2);
      path.lineTo(x0 + r, y1); path.arc(x0 + r, cy, r, Math.PI / 2, 3 * Math.PI / 2);
    } else {
      const c = (y1 - y0) * 0.3;
      path.moveTo(x0 + c, y0); path.lineTo(x1 - c, y0); path.lineTo(x1, y0 + c); path.lineTo(x1, y1 - c);
      path.lineTo(x1 - c, y1); path.lineTo(x0 + c, y1); path.lineTo(x0, y1 - c); path.lineTo(x0, y0 + c);
    }
    path.closePath();
    return path;
  };
  const text = p.cartouche === 'pill' ? cw - ch - 2 * w : p.cartouche === 'octagon' ? cw - ch * 0.6 - 3 * w : W - 2 * p.inset - 8 * w;
  return {cw, ch, cx, cy, path, text};
}
// Words at a size that fits the width, never larger than asked.
function fitted(text, size, width, g) {
  g.font = fontOf(size);
  const m = g.measureText(text).width;
  return m > width && m > 0 ? size * width / m : size;
}
function words(g, W, H, pl, draw) {
  const a = (p.line1 || '').trim(), b = (p.line2 || '').trim();
  const s1 = a ? fitted(a, p.size1, pl.text, g) : 0, s2 = b ? fitted(b, p.size2, pl.text, g) : 0;
  const out = [];
  if (a && b) { out.push([a, s1, pl.cy + s2 * 0.5 + s1 * 0.05]); out.push([b, s2, pl.cy - s1 * 0.55]); }
  else if (a || b) out.push([a || b, a ? s1 : s2, pl.cy]);
  if (draw) {
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const [t, s, y] of out) { g.save(); g.translate(pl.cx, y); g.scale(1, -1); g.font = fontOf(s); g.fillText(t, 0, 0); g.restore(); }
  }
  return {s1, s2, shrunk: s1 && s1 < p.size1 - 0.05 || s2 && s2 < p.size2 - 0.05, smallest: Math.min(...out.map(o => o[1]), 99)};
}

// ---------------------------------------------------------------------------------------------------------------
// Picture patterns for the background, drawn as lines about as wide as the frame's, on a staggered grid from the
// middle of the card, so they sit evenly round the plaque. s is the Pattern mm slider; motifs are a few times it.
const grid = (W, H, cell, each) => {
  const dy = cell * 0.866;
  for (let r = -Math.ceil(H / 2 / dy) - 1; r <= Math.ceil(H / 2 / dy) + 1; ++r)
    for (let c = -Math.ceil(W / 2 / cell) - 1; c <= Math.ceil(W / 2 / cell) + 1; ++c)
      each(W / 2 + (c + (r & 1) * 0.5) * cell, H / 2 + r * dy, r, c);
};
// A leaf: two curves meeting in points, with its middle vein.
function leaf(g, x, y, len, a) {
  g.save(); g.translate(x, y); g.rotate(a);
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * 0.5, len * 0.32, len, 0); g.quadraticCurveTo(len * 0.5, -len * 0.32, 0, 0); g.stroke();
  g.beginPath(); g.moveTo(len * 0.1, 0); g.lineTo(len * 0.8, 0); g.stroke();
  g.restore();
}
// A rose seen from above: a scalloped ring of petals round a cup, and a spiral in the middle.
function rose(g, x, y, r, turn) {
  g.save(); g.translate(x, y); g.rotate(turn);
  const n = 5;
  for (let k = 0; k < n; ++k) { const a = 2 * Math.PI * k / n; g.beginPath(); g.arc(0.58 * r * Math.cos(a), 0.58 * r * Math.sin(a), 0.42 * r, a - 1.25, a + 1.25); g.stroke(); }
  for (let k = 0; k < 4; ++k) { const a = 2 * Math.PI * k / 4 + 0.6; g.beginPath(); g.arc(0.28 * r * Math.cos(a), 0.28 * r * Math.sin(a), 0.3 * r, a - 1.2, a + 1.2); g.stroke(); }
  g.beginPath();
  for (let t = 0; t <= 1; t += 0.02) { const a = t * 4 * Math.PI, rr = r * (0.04 + 0.22 * t); t ? g.lineTo(rr * Math.cos(a), rr * Math.sin(a)) : g.moveTo(rr * Math.cos(a), rr * Math.sin(a)); }
  g.stroke();
  g.restore();
}
function daisy(g, x, y, r, n = 6) {
  for (let k = 0; k < n; ++k) { const a = 2 * Math.PI * k / n; g.save(); g.translate(x, y); g.rotate(a);
    g.beginPath(); g.ellipse(r * 0.58, 0, r * 0.42, r * 0.2, 0, 0, 2 * Math.PI); g.stroke(); g.restore(); }
  g.beginPath(); g.arc(x, y, r * 0.17, 0, 2 * Math.PI); g.fill();
}
function heart(g, x, y, r) {
  g.beginPath(); g.moveTo(x, y - r * 0.9);
  g.bezierCurveTo(x - r * 1.3, y + r * 0.1, x - r * 0.6, y + r * 1.0, x, y + r * 0.45);
  g.bezierCurveTo(x + r * 0.6, y + r * 1.0, x + r * 1.3, y + r * 0.1, x, y - r * 0.9); g.closePath(); g.stroke();
}
function star(g, x, y, r, turn = 0) {
  g.beginPath();
  for (let k = 0; k < 10; ++k) { const a = Math.PI / 2 + turn + Math.PI * k / 5, rr = k % 2 ? r * 0.45 : r; k ? g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)) : g.moveTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  g.closePath(); g.stroke();
}
function flake(g, x, y, r, turn = 0) {
  for (let k = 0; k < 6; ++k) { const a = turn + Math.PI * k / 3, c = Math.cos(a), sn = Math.sin(a);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + r * c, y + r * sn); g.stroke();
    for (const [t, l] of [[0.5, 0.3], [0.78, 0.2]]) for (const side of [1, -1]) { const b = a + side * 0.8;
      g.beginPath(); g.moveTo(x + r * t * c, y + r * t * sn); g.lineTo(x + r * t * c + r * l * Math.cos(b), y + r * t * sn + r * l * Math.sin(b)); g.stroke(); } }
}
const PATTERNS = {
  // Roses with leaves round them and small dots between, like the lace on a wedding card.
  roses(g, W, H, s, w) {
    const cell = s * 7;
    grid(W, H, cell, (x, y, r, c) => {
      const turn = (r * 3 + c * 7) % 5;
      rose(g, x, y, cell * 0.3, turn);
      for (const a of [0.5, 2.6, 4.3]) leaf(g, x + cell * 0.31 * Math.cos(a + turn), y + cell * 0.31 * Math.sin(a + turn), cell * 0.24, a + turn);
      for (const a of [1.5, 3.6, 5.5]) { const d = cell * 0.47; g.beginPath(); g.arc(x + d * Math.cos(a + turn), y + d * Math.sin(a + turn), w * 0.7, 0, 2 * Math.PI); g.fill(); }
    });
  },
  // A honeycomb net, like machine lace, with a small flower in some of the cells.
  lace(g, W, H, s, w) {
    const r = s * 0.9, dx = r * Math.sqrt(3), dy = r * 1.5;
    for (let row = -1; row * dy < H + dy; ++row)
      for (let col = -1; col * dx < W + dx; ++col) {
        const cx = col * dx + (row & 1) * dx / 2, cy = row * dy;
        g.beginPath(); for (let k = 0; k < 6; ++k) { const a = Math.PI / 6 + Math.PI * k / 3; k ? g.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a)) : g.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a)); }
        g.closePath(); g.stroke();
      }
    g.save(); g.lineWidth = w * 0.8;
    grid(W, H, s * 8, (x, y) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(x, y, s * 2.4, 0, 2 * Math.PI); g.fill(); g.restore(); daisy(g, x, y, s * 2.1, 8); });
    g.restore();
  },
  daisies(g, W, H, s, w) { grid(W, H, s * 4.5, (x, y, r, c) => ((r + c) % 3 ? daisy(g, x, y, s * 1.6) : (g.beginPath(), g.arc(x, y, w * 0.8, 0, 2 * Math.PI), g.fill()))); },
  // Sprigs of leaves along wavy stems.
  leaves(g, W, H, s, w) {
    const gap = s * 4;
    for (let y = H / 2 % gap - gap; y < H + gap; y += gap) {
      g.beginPath(); for (let x = -2; x <= W + 2; x += 1) { const yy = y + s * 0.5 * Math.sin(x / (s * 1.6)); x > -2 ? g.lineTo(x, yy) : g.moveTo(x, yy); } g.stroke();
      for (let x = 0, k = 0; x < W + s; x += s * 1.6, ++k) { const yy = y + s * 0.5 * Math.sin(x / (s * 1.6)), side = k % 2 ? 1 : -1;
        leaf(g, x, yy, s * 1.5, side * 0.9 + 0.4); }
    }
  },
  hearts(g, W, H, s) { grid(W, H, s * 3.5, (x, y, r) => heart(g, x, y, s * (r & 1 ? 0.8 : 1.05))); },
  stars(g, W, H, s, w) { grid(W, H, s * 3.5, (x, y, r, c) => (r + c) & 1 ? star(g, x, y, s * 1.2, 0.2 * ((r * 5 + c) % 3)) : (g.beginPath(), g.arc(x, y, w * 0.8, 0, 2 * Math.PI), g.fill())); },
  flakes(g, W, H, s) { grid(W, H, s * 4.5, (x, y, r, c) => flake(g, x, y, s * ((r + c) & 1 ? 1.1 : 1.7), (r + c) * 0.3)); },
  // Fish scales: rows of half circles, each row overlapping the one below.
  scales(g, W, H, s) {
    const r = s * 1.1;
    for (let row = 0, y = H + r; y > -r; y -= r * 0.7, ++row)
      for (let x = (row & 1) * r - r; x < W + 2 * r; x += 2 * r) { g.beginPath(); g.arc(x, y, r, Math.PI, 2 * Math.PI); g.stroke(); }
  },
};

function art(g, W, H) {
  const w = p.line, i = p.inset, j = p.frame === 'double' ? i + 2.2 * w : i;
  const R = Math.min(W, H) * 0.17, pl = plaque(W, H);
  const crown = {a: W * 0.2, s: Math.max(1.8 * w, H * 0.04)};
  g.strokeStyle = g.fillStyle = '#000'; g.lineWidth = w; g.lineJoin = 'miter'; g.lineCap = 'butt';
  const line = (x0, y0, x1, y1) => { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); };
  const corners = [[j, j, 1, 1], [W - j, j, -1, 1], [W - j, H - j, -1, -1], [j, H - j, 1, -1]];
  const crowns = [[H - j, -1], [j, 1]];   // from the top edge downwards, from the bottom edge upwards

  // The background pattern, inside the frame, cleared round everything drawn over it.
  if (p.fill !== 'none') {
    g.save();
    g.beginPath(); g.rect(j + 1.5 * w, j + 1.5 * w, W - 2 * j - 3 * w, H - 2 * j - 3 * w); g.clip();
    const s = p.space;
    if (p.fill === 'bars') for (let x = W / 2 % s; x < W; x += s) line(x, 0, x, H);
    else if (p.fill === 'diamonds') { g.lineWidth = w * 0.8; for (let c = -H; c < W + H; c += s * 1.6) { line(c, 0, c + H, H); line(c, H, c + H, 0); } }
    else if (p.fill === 'rays') { g.lineWidth = w * 0.8; const n = Math.round(Math.PI * Math.hypot(W, H) / (2 * s)); for (let k = 0; k < n; ++k) { const a = 2 * Math.PI * k / n; line(W / 2, H / 2, W / 2 + W * Math.cos(a), H / 2 + W * Math.sin(a)); } }
    else if (p.fill === 'dots') for (let r = 0, y = H / 2 % (s * 0.866); y < H; y += s * 0.866, ++r) for (let x = (r % 2 ? s / 2 : 0) + W / 2 % s; x < W; x += s) { g.beginPath(); g.arc(x, y, w * 0.75, 0, 2 * Math.PI); g.fill(); }
    else if (PATTERNS[p.fill]) { g.lineWidth = w * 0.8; g.lineCap = g.lineJoin = 'round'; PATTERNS[p.fill](g, W, H, s, w); }
    g.restore();
    g.save();
    g.globalCompositeOperation = 'destination-out';
    g.lineWidth = 5 * w;
    if (p.cartouche !== 'none') { g.fill(pl.path(2.5 * w)); g.stroke(pl.path(2.5 * w)); }
    else { const t = words(g, W, H, pl, false); g.fillRect(pl.cx - pl.text / 2 - 2 * w, pl.cy - t.s1 - t.s2, pl.text + 4 * w, 2 * (t.s1 + t.s2)); }
    if (p.corner === 'fans') for (const [x, y] of corners) { g.beginPath(); g.arc(x, y, R + 2 * w, 0, 2 * Math.PI); g.fill(); }
    if (p.corner === 'steps') for (const [x, y, sx, sy] of corners) g.fillRect(x, y, sx * (R * 0.9 + 2 * w), sy * (R * 0.9 + 2 * w));
    if (p.motif === 'steps') for (const [y0, d] of crowns) g.fillRect(W / 2 - crown.a - 2 * w, y0, 2 * crown.a + 4 * w, d * (3 * crown.s + 4 * w));

  // Frame.

      g.beginPath(); g.arc(x, y, R, start, start + Math.PI / 2); g.stroke();
      g.beginPath(); g.arc(x, y, R * 0.3, start, start + Math.PI / 2); g.stroke();
      for (let k = 1; k < 8; ++k) { const a = start + Math.PI / 2 * k / 8; line(x + R * 0.3 * Math.cos(a), y + R * 0.3 * Math.sin(a), x + R * 0.88 * Math.cos(a), y + R * 0.88 * Math.sin(a)); }
    } else if (p.corner === 'steps') {

  if (p.motif === 'steps') for (const [y0, d] of crowns) {
    const {a, s} = crown;
    g.beginPath(); g.moveTo(W / 2 - a, y0);
    for (let k = 1; k <= 3; ++k) { g.lineTo(W / 2 - a * (1 - (k - 1) / 3), y0 + d * k * s); g.lineTo(W / 2 - a * (1 - k / 3), y0 + d * k * s); }
    for (let k = 3; k >= 1; --k) { g.lineTo(W / 2 + a * (1 - k / 3), y0 + d * k * s); g.lineTo(W / 2 + a * (1 - (k - 1) / 3), y0 + d * k * s); }
    g.lineTo(W / 2 + a, y0); g.stroke();

    g.beginPath(); g.moveTo(W / 2, dy - r); g.lineTo(W / 2 + r, dy); g.lineTo(W / 2, dy + r); g.lineTo(W / 2 - r, dy); g.closePath(); g.fill();
  }

  if (p.cartouche !== 'none') {

    g.lineWidth = w * 0.7; g.stroke(pl.path(-1.8 * w)); g.lineWidth = w;
    if (p.cartouche === 'pill') {
      const r = pl.ch / 2 - 1.8 * w;
      for (const side of [-1, 1]) {
        const ex = pl.cx + side * (pl.cw / 2 - pl.ch / 2), from = side < 0 ? Math.PI / 2 : -Math.PI / 2;
        for (let k = 1; k < 6; ++k) { const a = from + Math.PI * k / 6; line(ex + r * 0.25 * Math.cos(a), pl.cy + r * 0.25 * Math.sin(a), ex + r * 0.8 * Math.cos(a), pl.cy + r * 0.8 * Math.sin(a)); }
        g.beginPath(); g.arc(ex, pl.cy, r * 0.25, from, from + Math.PI); g.stroke();
      }
    }
  }
  return words(g, W, H, pl, true);
}

// ---------------------------------------------------------------------------------------------------------------
// The flaps, in folding order, as seen on the front once folded. Each starts with its fold edge, along a side of
// the card: left (x = 0), right (x = W), bottom (y = 0) or top (y = H).
function flaps(W, H) {
  const pl = plaque(W, H), below = pl.cy - pl.ch / 2 - Math.max(3, 2.5 * p.line);
  if (p.style === 'wrap') {
    const d = Math.min(14, W * 0.16), c = Math.min(10, H * 0.15), yS = Math.min(H * 0.32, below);
    return [
      {at: 'left', poly: [[0, 0], [0, H], [d, H - c], [d, c]]},
      {at: 'right', poly: [[W, H], [W, 0], [W - d, c], [W - d, H - c]]},
      {at: 'bottom', poly: [[0, 0], [W, 0], [W, H * 0.44], [0, H * 0.44]]},
      {at: 'top', poly: [[W, H], [0, H], [0, yS], [W, yS]]},
    ];
  }
  const dS = W * 0.34, yS = Math.max(H * 0.2, below);
  return [
    {at: 'left', poly: [[0, 0], [0, H], [dS, H * 0.68], [dS, H * 0.32]]},
    {at: 'right', poly: [[W, H], [W, 0], [W - dS, H * 0.32], [W - dS, H * 0.68]]},
    {at: 'bottom', poly: [[0, 0], [W, 0], [W * 0.7, H * 0.42], [W * 0.3, H * 0.42]]},
    {at: 'top', poly: [[W, H], [0, H], [W * 0.14, yS], [W / 2, Math.max(2, yS - H * 0.22)], [W * 0.86, yS]]},
  ];
}
const NAMES = {left: 'left flap', right: 'right flap', bottom: 'bottom flap', top: 'top flap'};

// Squared distances to the nearest pixel where mask equals want (Felzenszwalb and Huttenlocher).
function edt(mask, w, h, want) {
  const BIG = 1e12, n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  const out = new Float64Array(w * h);

    let k = 0; v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
    for (let q = 1; q < len; ++q) {
      let s;
      for (;;) { const r = v[k]; s = (f[q] + q * q - f[r] - r * r) / (2 * q - 2 * r); if (s <= z[k]) --k; else break; }
      ++k; v[k] = q; z[k] = s; z[k + 1] = Infinity;
    }
    k = 0;
    for (let q = 0; q < len; ++q) { while (z[k + 1] < q) ++k; const r = v[k]; d[q] = (q - r) * (q - r) + f[r]; }
  };
  for (let x = 0; x < w; ++x) { for (let y = 0; y < h; ++y) f[y] = mask[y * w + x] === want ? 0 : BIG; pass(h); for (let y = 0; y < h; ++y) out[y * w + x] = d[y]; }
  for (let y = 0; y < h; ++y) { for (let x = 0; x < w; ++x) f[x] = out[y * w + x]; pass(w); for (let x = 0; x < w; ++x) out[y * w + x] = d[x]; }
  return out;
}
// A canvas in front pixels, drawn in mm with y up.
function layer(fw, fh, K, draw) {
  const c = document.createElement('canvas');
  c.width = fw; c.height = fh;
  const g = c.getContext('2d');
  g.setTransform(K, 0, 0, -K, 0, fh);
  draw(g);
  return c;
}
const alphaOf = c => c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
const polyPath = pts => { const path = new Path2D(); pts.forEach(([x, y], k) => k ? path.lineTo(x, y) : path.moveTo(x, y)); path.closePath(); return path; };

// Everything to print: per flap, its gold in front pixels; then the flat net, as a height per pixel.
function build() {
  const K = 1 / p.res, fw = Math.round(p.W * K), fh = Math.round(p.H * K), W = fw / K, H = fh / K, N = fw * fh;
  const G = Math.max(2, Math.round((p.board + 1) * K));   // fold gap: the card's edge plus room for the tulle to turn
  let info = null;
  const artC = layer(fw, fh, K, g => { info = art(g, W, H); });
  const artA = alphaOf(artC);
  const list = flaps(W, H);
  const masks = list.map(f => { const a = alphaOf(layer(fw, fh, K, g => { g.fillStyle = '#000'; g.fill(polyPath(f.poly)); })); const m = new Uint8Array(N); for (let k = 0; k < N; ++k) m[k] = a[4 * k + 3] > 127 ? 1 : 0; return m; });
  // What of each flap shows: its own area less the flaps folded over it, reaching a little under them so no seam opens.
  const lap2 = (Math.max(1.5, 1.5 * p.line) * K) ** 2;
  let uncovered = 0;
  for (let k = 0; k < N; ++k) if (!masks.some(m => m[k])) ++uncovered;
  list.forEach((f, n) => {
    const shown = new Uint8Array(N);
    for (let k = 0; k < N; ++k) shown[k] = masks[n][k] && !masks.slice(n + 1).some(m => m[k]) ? 1 : 0;
    const near = edt(shown, fw, fh, 1);
    // A rim along the free edges, so the tulle holds its shape.
    const rim = alphaOf(layer(fw, fh, K, g => {
      g.save(); g.clip(polyPath(f.poly));
      g.strokeStyle = '#000'; g.lineWidth = 2 * p.line; g.lineJoin = 'round';
      g.beginPath(); f.poly.slice(1).forEach(([x, y], k) => k ? g.lineTo(x, y) : g.moveTo(x, y)); g.lineTo(f.poly[0][0], f.poly[0][1]); g.stroke();
      g.restore();
    }));
    const ink = new Float32Array(N);
    for (let k = 0; k < N; ++k)
      if (masks[n][k] && near[k] <= lap2) ink[k] = Math.max(artA[4 * k + 3], rim[4 * k + 3]) / 255;
    f.ink = ink;
    f.shown = shown;
  });

  // The net: the back panel in the middle, each flap mirrored across its fold gap.
  const depth = f => Math.ceil(K * (f.at === 'left' ? Math.max(...f.poly.map(q => q[0])) : f.at === 'right' ? W - Math.min(...f.poly.map(q => q[0]))
    : f.at === 'bottom' ? Math.max(...f.poly.map(q => q[1])) : H - Math.min(...f.poly.map(q => q[1]))));
  const D = {left: 0, right: 0, bottom: 0, top: 0};
  for (const f of list) D[f.at] = Math.max(D[f.at], depth(f));
  const nw = D.left + G + fw + G + D.right + 2, nh = D.top + G + fh + G + D.bottom + 2, ox = 1 + D.left + G, oy = 1 + D.top + G;

        const v = f.ink[j * fw + i];
        if (v < 0.04) continue;
        const I = f.at === 'left' ? ox - G - 1 - i : f.at === 'right' ? ox + fw + G + (fw - 1 - i) : ox + i;
        const J = f.at === 'top' ? oy - G - 1 - j : f.at === 'bottom' ? oy + fh + G + (fh - 1 - j) : oy + j;
        put(I, J, v * p.thick);

  // The back panel as its four rim strips: the empty middle needs no points.
  const boxes = [[ox, oy, fw, r], [ox, oy + fh - r, fw, r], [ox, oy + r, r, fh - 2 * r], [ox + fw - r, oy + r, r, fh - 2 * r], [ox - G - D.left, oy, D.left, fh], [ox + fw + G, oy, D.right, fh], [ox, oy - G - D.top, fw, D.top], [ox, oy + fh + G, fw, D.bottom]];
  let area = 0;

}

// The net as sheets, one per panel, centred on the plate and turned if it only fits that way.
function sheets(b) {
  const turn = !fits(b.nw / b.K, b.nh / b.K, false) && fits(b.nw / b.K, b.nh / b.K, true);
  const cx = b.nw / 2, cy = b.nh / 2, out = [];
  for (const [x0, y0, w, h] of b.boxes) {
    if (w <= 0 || h <= 0) continue;
    const i0 = x0 - 1, j0 = y0 - 1, nu = w + 2, nv = h + 2;
    out.push(Lamp.sheet(nu, nv, false, (i, j, front) => {
      const I = i0 + i, J = j0 + j, x = (I + 0.5 - cx) / b.K, y = (cy - J - 0.5) / b.K;
      const z = front && I >= 0 && J >= 0 && I < b.nw && J < b.nh ? b.hgt[J * b.nw + I] : 0;
      return turn ? [y, -x, z] : [x, y, z];

}
const fits = (w, h, turned) => turned ? w <= printer.bed[1] && h <= printer.bed[0] : w <= printer.bed[0] && h <= printer.bed[1];

// ---------------------------------------------------------------------------------------------------------------
// Views
let built = null, timer = 0;
const on = (attr, v) => { for (const b of document.querySelectorAll(`[data-${attr}]`)) b.classList.toggle('on', b.dataset[attr] === v); };
function update() {
  on('card', p.card); on('style', p.style); on('frame', p.frame); on('corner', p.corner); on('cartouche', p.cartouche);
  on('motif', p.motif); on('fill', p.fill); on('tab', tab);
  $('styleHint').textContent = STYLE_HINTS[p.style];
  clearTimeout(timer);
  timer = setTimeout(render, 80);
}
function render() {
  built = build();
  problems();
  facts();
  draw();
}
function problems() {
  const b = built, out = [], w = b.nw / b.K, h = b.nh / b.K;
  if (!fits(w, h, false) && !fits(w, h, true))
    out.push(`Laid flat it is ${w.toFixed(0)} × ${h.toFixed(0)} mm, bigger than your ${printer.bed[0]} × ${printer.bed[1]} mm plate. Choose a smaller card${p.style === 'envelope' ? ', or the Wrap, which lies flatter' : ''}.`);
  if (p.line < 0.8) out.push('Lines under 0.8 mm are narrower than two 0.4 mm nozzle lines and may not hold the tulle. Use thicker lines or a 0.2 mm nozzle.');
  if (b.info.shrunk) out.push(`The words were made smaller to fit the plaque${b.info.smallest < 4 ? `, down to ${b.info.smallest.toFixed(1)} mm` : ''}. A wider plaque or a narrower font keeps them larger.`);
  if (b.info.smallest < 4 && !p.bold) out.push('Letters under 4 mm need to be bold, or printed with a 0.2 mm nozzle, to come out clean on tulle.');
  if (b.uncovered > 0.002) out.push('Some of the card shows between the flaps once folded.');
  if (p.thick < 0.6) out.push('Under 0.6 mm is two layers or fewer at 0.2 mm; the tulle may pull out of the lines.');
  $('problem').innerHTML = out.join('<br>');
  $('problem').classList.toggle('hidden', !out.length);
}
function facts() {
  const b = built, w = b.nw / b.K, h = b.nh / b.K, grams = b.area * p.thick * 1.24 / 1000;
  const order = b.list.map((f, n) => `${n + 1}. ${NAMES[f.at]}`).join(', ');
  $('facts').innerHTML = `Flat it is ${w.toFixed(0)} × ${h.toFixed(0)} mm, about ${grams.toFixed(1)} g of filament, ${p.thick} mm thick. ` +
    `Cut the card ${p.W} × ${p.H} mm and the tulle at least ${Math.ceil(w + 30)} × ${Math.ceil(h + 30)} mm.<br>` +
    `<b>Printing:</b> stretch the tulle flat over the plate and tape it down on all sides, or hold it with a glue stick, then print on it. If the nozzle catches the tulle, raise the Z offset by 0.1 mm. ` +
    `Peel it off, trim the tulle about 2 mm outside the gold, lay the card on the middle panel and fold ${order}. A dot of glue under the tip holds the last flap.`;
}

function tint(ink, fw, fh, colour) {
  const c = document.createElement('canvas');
  c.width = fw; c.height = fh;
  const g = c.getContext('2d'), img = g.createImageData(fw, fh), px = img.data;
  const [r, gg, bb] = [1, 3, 5].map(n => parseInt(colour.substr(n, 2), 16));
  for (let k = 0; k < fw * fh; ++k) { px[4 * k] = r; px[4 * k + 1] = gg; px[4 * k + 2] = bb; px[4 * k + 3] = Math.round(255 * Math.min(1, ink[k])); }
  g.putImageData(img, 0, 0);
  return c;
}
const shade = (hex, f) => '#' + [1, 3, 5].map(n => Math.min(255, Math.round(parseInt(hex.substr(n, 2), 16) * f)).toString(16).padStart(2, '0')).join('');
function draw() {
  if (!built) return;
  const c = $('view'), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext('2d'), b = built, pad = 30 * dpr, tulle = $('tulle').value, gold = $('gold').value;
  g.clearRect(0, 0, c.width, c.height);
  g.imageSmoothingQuality = 'high';
  if (tab === 'front') {
    const s = Math.min((c.width - 2 * pad) / b.W, (c.height - 2 * pad) / b.H), x = (c.width - b.W * s) / 2, y = (c.height - b.H * s) / 2;
    g.save();
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 18 * dpr; g.shadowOffsetY = 5 * dpr;
    g.fillStyle = shade(tulle, 0.7); g.fillRect(x, y, b.W * s, b.H * s);
    g.restore();
    // Each flap in folding order: a veil of tulle, then its gold, casting a small shadow on what is under it.
    for (const f of b.list) {
      g.save();
      g.translate(x, y + b.H * s); g.scale(s, -s);
      g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 6 * dpr; g.shadowOffsetY = -1.5 * dpr;
      g.fillStyle = tulle + 'cc'; g.fill(polyPath(f.poly));
      g.restore();
      g.save();

      g.restore();
    }
  } else {
    const w = b.nw, h = b.nh, s = Math.min((c.width - 2 * pad) / w, (c.height - 2 * pad) / h), x = (c.width - w * s) / 2, y = (c.height - h * s) / 2;
    g.fillStyle = tulle; g.fillRect(x - 10 * b.K * s, y - 10 * b.K * s, (w + 20 * b.K) * s, (h + 20 * b.K) * s);
    const ink = new Float32Array(w * h);
    for (let k = 0; k < ink.length; ++k) ink[k] = b.hgt[k] / p.thick;
    g.save();
    g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 2 * dpr; g.shadowOffsetX = 0.8 * dpr; g.shadowOffsetY = 0.8 * dpr;

    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1 * dpr; g.setLineDash([5 * dpr, 4 * dpr]);
    const X = i => x + i * s, Y = j => y + j * s, half = b.G / 2;
    g.beginPath();
    g.moveTo(X(b.ox - half), Y(b.oy)); g.lineTo(X(b.ox - half), Y(b.oy + b.fh));
    g.moveTo(X(b.ox + b.fw + half), Y(b.oy)); g.lineTo(X(b.ox + b.fw + half), Y(b.oy + b.fh));
    g.moveTo(X(b.ox), Y(b.oy - half)); g.lineTo(X(b.ox + b.fw), Y(b.oy - half));
    g.moveTo(X(b.ox), Y(b.oy + b.fh + half)); g.lineTo(X(b.ox + b.fw), Y(b.oy + b.fh + half));
    g.stroke(); g.setLineDash([]);
    g.font = `600 ${15 * dpr}px -apple-system, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    const spot = {left: [b.ox - b.G - b.boxes[4][2] * 0.35, b.oy + b.fh / 2], right: [b.ox + b.fw + b.G + b.boxes[5][2] * 0.35, b.oy + b.fh / 2],
                  top: [b.ox + b.fw / 2, b.oy - b.G - b.boxes[6][3] * 0.3], bottom: [b.ox + b.fw / 2, b.oy + b.fh + b.G + b.boxes[7][3] * 0.3]};
    b.list.forEach((f, n) => {
      const [i, j] = spot[f.at];
      g.fillStyle = 'rgba(0,0,0,.6)'; g.beginPath(); g.arc(X(i), Y(j), 12 * dpr, 0, 2 * Math.PI); g.fill();
      g.fillStyle = '#fff'; g.fillText(String(n + 1), X(i), Y(j));
    });
    g.fillStyle = 'rgba(255,255,255,.7)'; g.font = `${12 * dpr}px -apple-system, sans-serif`;
    g.fillText('card goes here', X(b.ox + b.fw / 2), Y(b.oy + b.fh / 2));
  }
}

window.fromApp = message => { if (message.type === 'printer') { printer = message; update(); } };
$('cancel').onclick = () => post({cmd: 'close'});
$('add').onclick = () => {
  if (!built) return;
  post(Lamp.addMessage('Tulle card wrap', [{name: 'Gold on tulle', sheets: sheets(built)}]));
};
window.onresize = () => { clearTimeout(timer); timer = setTimeout(draw, 80); };
document.fonts && document.fonts.ready.then(() => update());
showAll();
update();
post({cmd: 'ready'});
</script>
</body>
