<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set Up This Print</title>
<link rel="stylesheet" href="style.css">
<style>
  .field { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 12px; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  select { width: 100%; }
  .field.top { align-items: start; }
  .heads { display: grid; gap: 6px; }
  .head { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: #16171a; }
  .head.selected { border-color: var(--accent); outline: 1px solid var(--accent); }
  .swatch { flex: none; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); }
  .head small { margin-left: auto; color: var(--muted); }
  .filamentWrap { display: flex; align-items: center; gap: 8px; }
</style>
</head>
<body>
<h1>Set up this print</h1>
<p class="sub">Your printer and settings are used, whatever this file was made for.</p>

<div id="error" class="note bad hidden"></div>

<div class="panel">
  <div id="printerRow" class="field hidden"><label for="printer">Printer</label><select id="printer"></select></div>
  <div id="nozzleRow" class="field hidden"><label for="nozzle">Nozzle</label><select id="nozzle"></select></div>
  <div id="headRow" class="field top hidden"><label>Print head</label><div id="heads" class="heads"></div></div>
  <div id="filaments"></div>
</div>

<div class="footer">
  <button id="later">Not now</button>
  <button id="use" class="primary">Use these</button>
</div>

<script>
const $ = id => document.getElementById(id);
const post = message => window.wx.postMessage(JSON.stringify(message));
let printers = [];
let appHeads = [];
let loaded = {};
let selectedHead = 0;
let filamentTouched = false;

function fill(select, items, value) {
  select.replaceChildren(...items.map(item => new Option(item.label, item.value)));
  if (value !== undefined) select.value = value;
}

function showNozzles(current) {
  const model = printers.find(printer => printer.model === $('printer').value);
  fill($('nozzle'), model.variants.map(variant => ({label: variant.label, value: variant.name})), current);
  $('nozzleRow').classList.toggle('hidden', model.variants.length < 2);
}

function headInfo(index) {
  const fromPrinter = loaded[index];
  return fromPrinter || appHeads[index] || {};
}

function drawHeads() {
  $('heads').replaceChildren(...appHeads.map((_, index) => {
    const info = headInfo(index);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'head' + (index === selectedHead ? ' selected' : '');
    const swatch = document.createElement('span');
    swatch.className = 'swatch';
    swatch.style.background = info.colour || 'transparent';
    const name = document.createElement('span');
    name.textContent = `Head ${index + 1}`;
    const what = document.createElement('small');
    what.textContent = info.material || info.preset || 'Empty';
    button.append(swatch, name, what);
    button.onclick = () => {
      selectedHead = index;
      filamentTouched = false;
      drawHeads();
      useHeadFilaments();
    };
    return button;
  }));
}

// Puts each filament row on what its head has, until the user picks something else.
function useHeadFilaments() {
  if (filamentTouched) return;
  const selects = document.querySelectorAll('.filament');
  selects.forEach((select, row) => {
    const info = headInfo(selects.length === 1 ? selectedHead : row);
    if (info.preset && [...select.options].some(option => option.value === info.preset)) select.value = info.preset;
    const swatch = select.parentElement.querySelector('.swatch');
    swatch.style.background = info.colour || 'transparent';
  });
}

window.fromApp = message => {
  if (message.type === 'state') {
    printers = message.printers;
    appHeads = message.head_info;
    fill($('printer'), printers.map(printer => ({label: printer.model, value: printer.model})), message.model);
    $('printerRow').classList.toggle('hidden', printers.length < 2);
    showNozzles(message.printer);

    if (selectedHead >= message.heads) selectedHead = 0;
    drawHeads();
    $('headRow').classList.toggle('hidden', message.heads < 2 || message.slots > 1);

    $('filaments').replaceChildren(...message.current.map((name, slot) => {
      const row = document.createElement('div');
      row.className = 'field';
      const label = document.createElement('label');
      label.textContent = message.slots > 1 ? `Filament ${slot + 1}` : 'Filament';
      const wrap = document.createElement('div');
      wrap.className = 'filamentWrap';
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      const select = document.createElement('select');
      select.className = 'filament';
      label.htmlFor = select.id = `filament${slot}`;
      fill(select, message.filaments, name);
      select.onchange = () => { filamentTouched = true; };
      wrap.append(swatch, select);
      row.append(label, wrap);
      return row;
    }));
    useHeadFilaments();
    $('use').disabled = false;
  } else if (message.type === 'loaded') {
    loaded = {};
    for (const slot of message.slots) {
      loaded[slot.slot - 1] = slot.has ? slot : {material: 'Empty'};
    }
    drawHeads();
    useHeadFilaments();
  } else if (message.type === 'error') {
    $('error').textContent = message.message;
    $('error').classList.remove('hidden');
  }
};

function choosePrinter(name) {
  $('use').disabled = true;
  post({cmd: 'select_printer', name});
}

$('printer').onchange = () => {
  showNozzles();
  choosePrinter($('nozzle').value);
};
$('nozzle').onchange = () => choosePrinter($('nozzle').value);
$('later').onclick = () => post({cmd: 'close'});
$('use').onclick = () => post({
  cmd: 'apply',
  head: selectedHead + 1,
  filaments: [...document.querySelectorAll('.filament')].map(select => select.value),
  // Only what the printer reports changes a colour; the app's own stay as they are.
  colours: [...document.querySelectorAll('.filament')].map((_, row, all) => (loaded[all.length === 1 ? selectedHead : row] || {}).colour || ''),
});
post({cmd: 'ready'});
</script>
</body>
</html>
